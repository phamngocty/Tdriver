[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = opi_opi

build_flags =
    ; PSRAM
    -DBOARD_HAS_PSRAM
    -DCONFIG_ESP32_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM_IGNORE_NOTFOUND=1
    -DCONFIG_SPIRAM_BOOT_INIT=1
    -DCONFIG_SPIRAM_USE_CAPS_ALLOC=1
    -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=16384
    -DCONFIG_SPIRAM_TRY_ALLOC_WITH_LOCK=1
    -std=gnu++17

    ; TFT_eSPI (board: ESP32-S3-N16R16)
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_CS=9
    -DTFT_DC=8
    -DTFT_RST=14
    -DTFT_MOSI=11
    -DTFT_MISO=12
    -DTFT_SCLK=10
    -DTFT_BL=2
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bitbank2/JPEGDEC@^1.3.3
    fbiego/ESP32Time@^2.0.4
    mathertel/OneButton@^2.5.0

lib_extra_dirs = D:\Documents\Arduino\libraries\FontMaker

monitor_speed = 115200
